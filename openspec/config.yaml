schema: spec-driven

context: |
  Language: pl
  All artifacts must be written in pl.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: DevGuide - toolset, który pozwala deweloperowi rozumieć i kontrolować
  pracę agenta AI (Claude Code) nad kodem. Pełny plan i zasady: docs/devguide-plan.md.
  Czytaj ten plik przed każdą propozycją; zmiany mają odpowiadać jego etapom.

  Stan: szkielet repozytorium (stack, katalogi, sprawdzenia), potwierdzona
  eksperymentem integracja z Claude Code (Etap 2: hook zapisujący zdarzenia
  narzędzi do surowego dziennika, blokada PreToolUse, minimalny skill
  /devguide, wznawianie sesji, kontekst w SessionStart) oraz dziennik zadania
  (Etap 3, process/): jeden plik JSONL na zadanie, zdarzenia z narzędzi przez
  hook i ustalenia agenta przez `node process/cli.ts record`, reguły statusu
  sprawdzenia (passed tylko z zarejestrowanym wykonaniem i dowodem z wyjścia)
  i potwierdzenia decyzji (cytat z wypowiedzi użytkownika), objaśnienie
  poprawki (`change_explained`) wiązane przy zapisie ze zmianami plików,
  odczyt przez `replay`/`status`. Format i polecenia: docs/task-event-log.md.
  Lokalny podgląd (Etap 4): `npm run preview` uruchamia serwer
  (process/server.ts) na localhost, model widoków liczy process/preview-model.ts,
  strona w ui/ (index.html, preview.css, preview.js - jedyny plik JS, testowany
  w Node) pokazuje trzy widoki (przebieg, kod AI, wyniki sprawdzeń) i aktualizuje
  się po każdym zdarzeniu przez Server-Sent Events. Przebieg jest według makiety
  produktu: historia znaczących kroków po lewej (zgłoszenie, ustalenia agenta,
  zmiany w kodzie, sprawdzenia, decyzje), widok wybranego kroku po prawej z
  krótkim wyjaśnieniem i tylko potrzebnym konkretem; polecenia, wypowiedzi
  agenta, czasy i identyfikatory są wyłącznie w rozwijanych źródłach kroku;
  zadanie bez ustaleń dostaje rzeczowe kroki odtworzone z poleceń i wyjść;
  linia stanu rozdziela wykonanie (ostatnie zdarzenie, w tym session_ended)
  od weryfikacji; zakładki „Kod AI” i „Wyniki sprawdzeń” tylko gdy mają treść;
  przyciski decyzji tylko przy przygotowanej poprawce i oznaczone jako
  demonstracja do Etapu 6. Opis: docs/local-preview.md.
  Skill prowadzący (Etap 5, .claude/skills/devguide/SKILL.md) każe agentowi
  zapisywać obserwacje, podejrzenia, objaśnienia poprawek i sprawdzenia przez
  CLI w trakcie pracy i zmieniać pliki tylko przez Write/Edit; kontekst przy
  starcie sesji powtarza zasady; eksperyment ma trzecią sesję z naturalnym
  zadaniem i dziesiąte pytanie o samodzielny zapis ustaleń. Punkt kontroli
  (Etap 6) jeszcze nie istnieje: przyciski decyzji w podglądzie są demonstracją.
  Nie zakładaj, że cokolwiek działa, dopóki nie zostało zaimplementowane
  i sprawdzone w tym repo.

  Stack (docs/stack.md): Node.js 24 + TypeScript uruchamiany natywnie bez
  budowania, testy w node:test (*.test.ts obok kodu), jeden package.json.
  Katalogi: agent/ (integracja z Claude Code), process/ (lokalny proces),
  ui/ (podgląd), demo/ (projekt demonstracyjny), scripts/ (sprawdzenia).
  Polecenie sprawdzające: `npm run check` (check:types, check:test,
  check:links, check:specs); to samo uruchamia CI. Każda zmiana ma
  przechodzić `npm run check` przed zakończeniem.

  Zakres pierwszej wersji: jeden użytkownik, jedno zadanie, jedno repozytorium,
  Claude Code. Bez kont, chmury, zespołów i wielu agentów.

  Zasady, które obowiązują w każdej zmianie:
  - prosty język w interfejsie; identyfikatory techniczne tylko w szczegółach;
  - obserwacje narzędzi oddzielone od interpretacji AI;
  - wyniki sprawdzeń powiązane z konkretną wersją kodu;
  - historia błędnych hipotez zachowana, nie nadpisywana;
  - status "sprawdzone" wymaga zarejestrowanego wykonania i wyniku;
  - symulowana blokada nigdy nie jest przedstawiana jako realna kontrola;
  - brak zależności od firmowego QA lub konkretnego systemu testów.

  Faktyczne możliwości integracji Claude Code, potwierdzone eksperymentem
  (`npm run experiment`, Claude Code 2.1.300, 2026-10-21), wraz z kształtem
  danych z hooków i ograniczeniami: docs/claude-code-integration.md. Opieraj
  kolejne etapy na tym dokumencie. Każdą zmianę dotykającą integracji
  potwierdzaj ponownym uruchomieniem eksperymentu, nie opisem makiety.

rules:
  proposal:
    - Wskaż etap planu (docs/devguide-plan.md), który realizuje zmiana.
    - Zawsze podaj, co jest poza zakresem.
    - Jedna zmiana = jeden działający przyrost, który da się sprawdzić.
  tasks:
    - Każde zadanie ma mieć sprawdzalny wynik (plik, polecenie, zachowanie).
    - "Ostatnie zadanie to zawsze: jak ręcznie zweryfikować przyrost."
  specs:
    - Wymagania opisuj zachowaniem widocznym dla użytkownika, nie implementacją.

operations:
  apply:
    guidance:
      - Pracuj małymi przyrostami; po każdym uruchom dostępne sprawdzenia.
      - Nie oznaczaj zadania jako wykonanego bez faktycznego uruchomienia sprawdzenia.
  archive:
    guidance:
      - "Podsumuj: co działa, jak to sprawdzono, jakie są ograniczenia, następny krok."
